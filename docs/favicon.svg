<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#171c24"/>
  <!-- Delta - the change. This is the real Georgia Bold glyph for U+0394, converted to a
       path rather than left as <text>: an SVG favicon renders with the VIEWER's fonts, so a
       text element would fall back to something else on any machine without Georgia. As a
       path it looks the same everywhere. Bold, because at 16px the regular weight's counter
       closes up and it turns into a solid blob. -->
