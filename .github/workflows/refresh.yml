# Weekly refresh: re-pull the estimates, rebuild the page, commit the result.
# No deploy secrets - GitHub Pages serves the committed docs/ directly.
name: Refresh

on:
  schedule:
    - cron: "0 21 * * 0"      # Mondays 07:00 AEST (21:00 UTC Sunday)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - run: python fetch.py
      # What Shortfall covers, so the Also on column never offers a link into a page
      # that does not rank the company. Fetched, cached under peers/, and falling back
      # to that cache when the sibling is unreachable.
      - run: python peers.py
      - run: python build.py
      - run: python archive.py
      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.csv docs/index.html docs/tickers.json peers/
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          git push
